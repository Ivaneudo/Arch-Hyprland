# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    path = screenshot
    color = rgba(26, 20, 16, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(196, 168, 130, 0.7)
    inner_color = rgba(42, 34, 28, 0.95)
    font_color = #c8b8a8
    fade_on_empty = false
    placeholder_text = <i>Digite sua senha...</i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
    check_color = rgb(144, 238, 144)
    fail_color = rgb(204, 85, 85)
    fail_text = <i>$FAIL (<b>$ATTEMPTS</b>)</i>
    fail_timeout = 2000
    capslock_color = rgb(255, 165, 0)
}

label {
    monitor =
    text = $TIME
    color = #c8b8a8
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Olá, $USER
    color = #c4a882
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
